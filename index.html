<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starforge Echoes</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud__left">
          <h1>Starforge Echoes</h1>
          <div class="run-info">
            <span id="seed-label">Seed: --</span>
            <span id="floor-label">Sector: 1</span>
          </div>
        </div>
        <div class="hud__right">
          <button id="pause-btn" class="btn">Pause</button>
          <button id="restart-btn" class="btn">Restart</button>
        </div>
      </header>
      <main class="main">
        <canvas id="game" width="960" height="600" aria-label="Starforge Echoes game canvas"></canvas>
        <aside class="panel">
          <section>
            <h2>Controls</h2>
            <ul id="controls-list"></ul>
            <button id="remap-btn" class="btn">Remap Controls</button>
          </section>
          <section>
            <h2>Run Tools</h2>
            <label>
              Seed
              <input id="seed-input" type="text" placeholder="Enter seed" />
            </label>
            <div class="button-row">
              <button id="seed-apply" class="btn">Apply Seed</button>
              <button id="seed-daily" class="btn">Seed of the Day</button>
            </div>
            <label>
              Replay JSON
              <textarea id="replay-data" rows="5" placeholder="Paste replay data"></textarea>
            </label>
            <div class="button-row">
              <button id="replay-record" class="btn">Start Recording</button>
              <button id="replay-stop" class="btn">Stop & Copy</button>
              <button id="replay-play" class="btn">Play Replay</button>
            </div>
          </section>
          <section>
            <h2>Dev Tools</h2>
            <label class="checkbox">
              <input id="toggle-debug" type="checkbox" />
              Debug Overlay
            </label>
            <label class="checkbox">
              <input id="toggle-perf" type="checkbox" checked />
              Performance HUD
            </label>
          </section>
          <section>
            <h2>Objective</h2>
            <p>Find the starforge core in each sector, defeat guardians, and escape.</p>
          </section>
        </aside>
      </main>
      <div id="overlay" class="overlay hidden">
        <div class="overlay__panel">
          <h2 id="overlay-title">Paused</h2>
          <p id="overlay-body"></p>
          <button id="overlay-resume" class="btn">Resume</button>
        </div>
      </div>
      <div id="perf" class="perf"></div>
      <div id="debug" class="debug hidden"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
